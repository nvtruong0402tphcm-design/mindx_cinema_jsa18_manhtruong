<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    <link rel="stylesheet" href="./style.css">

    <script src="./script/login.js" defer></script>
</head>
<body><body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card p-4" style="min-width: 500px;">

        <h2 class="text-center mb-4">Đăng ký</h2>

        <form>

            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Nhập lại mật khẩu
                </label>

                <input type="password" class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Đăng ký
            </button>

        </form>

        <p class="text-center mt-3">
            Đã có tài khoản?
            <a href="login.html">Đăng nhập</a>
        </p>

    </div>

</body>
    
</body>
</html>
